AWSTemplateFormatVersion: '2010-09-09'
Description: Monitoring Stack for WordPress Application

Parameters:

  EmailAddress:
    Type: String
    Description: Email address for SNS notifications

  EC2InstanceId:
    Type: String
    Description: EC2 Instance ID

  RDSInstanceIdentifier:
    Type: String
    Description: RDS Instance Identifier

Resources:

  SNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: wordpress-alerts

  SNSSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref EmailAddress
      TopicArn: !Ref SNSTopic

  EC2CPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: EC2 CPU Utilization High
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref EC2InstanceId
      AlarmActions:
        - !Ref SNSTopic

  RDSCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: RDS CPU Utilization High
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref RDSInstanceIdentifier
      AlarmActions:
        - !Ref SNSTopic

Outputs:

  SNSTopicArn:
    Description: SNS Topic ARN
    Value: !Ref SNSTopic